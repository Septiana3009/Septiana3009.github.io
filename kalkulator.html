<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <!-- Fix Link Font Poppins -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-calc: #ffffff;
            --text-main: #4a4a4a;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9e6;
            --btn-bg: #f8f9fb;
            --accent: #7d5fff;
        }

        .dark-mode {
            --bg-body: #1e272e;
            --bg-calc: #2d3436;
            --text-main: #f1f2f6;
            --shadow-light: #3d4446;
            --shadow-dark: #161d1f;
            --btn-bg: #353b48;
            --accent: #a29bfe;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: var(--bg-body); 
            margin: 0; 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .container { 
            display: flex; 
            gap: 25px; 
            flex-wrap: wrap; 
            justify-content: center; 
            padding: 20px; 
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .calculator { 
            background: var(--bg-calc); 
            padding: 30px; 
            border-radius: 35px; 
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light); 
            width: 350px; 
            position: relative;
        }

        #display { 
            width: 100%; 
            height: 90px; 
            font-size: 2.8rem; 
            text-align: right; 
            margin-bottom: 25px; 
            border: none; 
            background: transparent; 
            color: var(--text-main); 
            outline: none;
            padding: 10px 20px;
            box-sizing: border-box;
            font-weight: 600;
            transition: transform 0.1s ease;
        }

        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }

        button { 
            padding: 18px; 
            font-size: 1.1rem; 
            font-weight: 600; 
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background: var(--btn-bg); 
            color: var(--text-main);
            box-shadow: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 8px 8px 15px var(--shadow-dark), -8px -8px 15px var(--shadow-light);
        }

        button:active { 
            transform: scale(0.92); 
            box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -3px -3px 8px var(--shadow-light); 
        }

        /* Warna Khusus */
        .trig { background: #f0f0ff; color: var(--accent); font-size: 0.85rem; }
        .operator { background: #fff4e6; color: #ff9f43; }
        .equals { background: #e3fcef; color: #00b894; }
        .clear { background: #fff0f0; color: #ff7675; }
        .delete { background: #f1f2f6; color: #4a4a4a; }

        /* Style Riwayat */
        .history-panel {
            background: var(--bg-calc); 
            width: 280px; 
            border-radius: 30px;
            padding: 25px; 
            box-shadow: 15px 15px 35px var(--shadow-dark);
            height: 520px; 
            display: flex;
            flex-direction: column;
        }

        #history-list { 
            overflow-y: auto; 
            flex-grow: 1; 
            padding-right: 5px;
        }

        /* Scrollbar Halus */
        #history-list::-webkit-scrollbar { width: 5px; }
        #history-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

        .history-item { 
            border-bottom: 1px solid rgba(0,0,0,0.04); 
            padding: 15px 5px; 
            font-size: 0.95rem; 
            cursor: pointer; 
            color: var(--text-main);
            transition: 0.3s;
        }
        .history-item:hover { background: rgba(0,0,0,0.02); transform: translateX(8px); }
        .history-item span { color: #aaa; display: block; font-size: 0.8rem; margin-bottom: 3px; }

        .btn-mode {
            padding: 8px 15px; font-size: 0.75rem; border-radius: 12px;
            background: var(--btn-bg); color: var(--text-main);
            box-shadow: 3px 3px 6px var(--shadow-dark);
            border: none; cursor: pointer; font-weight: 600;
        }

        @media (max-width: 700px) {
            .container { flex-direction: column; align-items: center; }
            .history-panel { width: 350px; height: 250px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="calculator">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button class="btn-mode" onclick="toggleMode()">🌙 Mode</button>
            <span style="font-size: 0.8rem; color: #bbb; font-weight: 600; letter-spacing: 1px;">calculator</span>
        </div>
        
        <input type="text" id="display" disabled placeholder="0">
        
        <div class="buttons">
            <button class="trig" onclick="trig('sin')">SIN</button>
            <button class="trig" onclick="trig('cos')">COS</button>
            <button class="trig" onclick="trig('tan')">TAN</button>
            <button class="clear" onclick="clearDisplay()">AC</button>

            <button onclick="appendToDisplay('(')">(</button>
            <button onclick="appendToDisplay(')')">)</button>
            <button class="delete" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="appendToDisplay('/')">÷</button>

            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('*')">×</button>

            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('-')">−</button>

            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>

            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button class="operator" onclick="appendToDisplay('%')">%</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <div class="history-panel">
        <h4 style="margin: 0 0 15px 0; color: var(--text-main); font-weight: 600;">Riwayat</h4>
        <div id="history-list"></div>
        <button onclick="clearHistory()" style="margin-top:15px; font-size: 0.8rem; color: #ff7675; background: none; border:none; cursor:pointer;">Hapus Semua</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    const historyList = document.getElementById('history-list');

    // Efek Suara Klik
    function playClick() {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(150, context.currentTime);
        gain.gain.setValueAtTime(0.1, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.1);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + 0.1);
    }

    function toggleMode() {
        playClick();
        document.body.classList.toggle('dark-mode');
    }

    function appendToDisplay(input) {
        playClick();
        // Animasi pop-up angka
        display.style.transform = "scale(1.1)";
        setTimeout(() => display.style.transform = "scale(1)", 100);
        display.value += input;
    }

    function clearDisplay() {
        playClick();
        display.value = "";
    }

    function deleteLast() {
        playClick();
        display.value = display.value.slice(0, -1);
    }

    function trig(type) {
        playClick();
        try {
            let val = eval(display.value.replace(/(\d+)%/g, '($1/100)')) || 0;
            let rad = val * (Math.PI / 180);
            let res = (type === 'sin') ? Math.sin(rad) : (type === 'cos') ? Math.cos(rad) : Math.tan(rad);
            let finalRes = parseFloat(res.toFixed(5));
            tambahRiwayat(`${type}(${val}°)`, finalRes);
            display.value = finalRes;
        } catch { display.value = "Error"; }
    }

    function calculate() {
        playClick();
        if (!display.value) return;
        try {
            let asli = display.value;
            let ekspresi = asli.replace(/(\d+)%/g, '($1/100)');
            let hasil = eval(ekspresi);
            hasil = Number.isInteger(hasil) ? hasil : parseFloat(hasil.toFixed(6));
            tambahRiwayat(asli, hasil);
            display.value = hasil;
        } catch {
            display.value = "Error";
            setTimeout(clearDisplay, 1000);
        }
    }

    function tambahRiwayat(ekspresi, hasil) {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<span>${ekspresi} =</span> <strong>${hasil}</strong>`;
        item.onclick = () => { playClick(); display.value = hasil; };
        historyList.prepend(item);
    }

    function clearHistory() {
        playClick();
        historyList.innerHTML = "";
    }
</script>

</body>
</html>
